*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  --surface-3:#161616;
  --border:#2A2A2A;
  --border-subtle:#1A1A1A;
  --text:#F0F0F0;
  --text-secondary:#AAAAAA;
  --text-muted:#666;
  --text-dim:#3A3A3A;
  --accent:#C8FF00;
  --accent-dim:rgba(200,255,0,0.12);
  --accent-glow:rgba(200,255,0,0.25);
  --warn:#FF6B35;
  --warn-dim:rgba(255,107,53,0.15);
  --ok:#00E5A0;
  --ok-dim:rgba(0,229,160,0.12);
  --red:#FF4040;
  --sidebar:272px;
  --right:252px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px}
#root{height:100%}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:2px}

@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastSlide{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes glow{0%,100%{box-shadow:0 0 12px var(--accent-glow)}50%{box-shadow:0 0 24px var(--accent-glow),0 0 40px var(--accent-dim)}}
@keyframes dropIn{from{transform:scale(0.8) translateY(-8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

// ─── TOAST ────────────────────────────────────────────────────────
function Toast({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3800); return () => clearTimeout(t); }, []);
  const isWarn = type === 'warn';
  const accent = isWarn ? 'var(--warn)' : 'var(--ok)';
  return (
    <div style={{
      position:'fixed', bottom:28, right:28, zIndex:9999,
      background:'#0E0E0E', border:`1px solid ${accent}`,
      borderLeft:`3px solid ${accent}`,
      padding:'12px 16px', maxWidth:300, minWidth:240,
      animation:'toastSlide 0.3s cubic-bezier(.2,.8,.4,1)',
      boxShadow:'0 8px 32px rgba(0,0,0,0.6)',
    }}>
      <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
        <span style={{color:accent,fontSize:13,flexShrink:0,marginTop:1}}>{isWarn ? '⚠' : '✓'}</span>
        <p style={{fontSize:10,color:'#CCC',lineHeight:1.6,flex:1}}>{msg}</p>
        <button onClick={onClose} style={{background:'none',border:'none',color:'#444',cursor:'pointer',fontSize:16,lineHeight:1,padding:0,flexShrink:0}}>×</button>
      </div>
    </div>
  );
}

        </div>

        {/* Outfit recipe */}

// ─── WARDROBE ITEM ────────────────────────────────────────────────
function Item({ item, onDragStart, onDragEnd }) {
  const [hov, setHov] = useState(false);
  const [drag, setDrag] = useState(false);
  return (
    <div
      draggable
      onDragStart={e => {
        setDrag(true);
        e.dataTransfer.setData('itemId', item.id);
        e.dataTransfer.effectAllowed = 'copy';
        onDragStart(item);
      }}
      onDragEnd={() => { setDrag(false); onDragEnd(); }}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        background: hov ? '#151515' : '#0E0E0E',
        border: `1px solid ${hov ? 'var(--accent)' : '#1A1A1A'}`,
        padding:'10px',
        cursor:'grab',
        opacity: drag ? 0.4 : 1,
        transition:'all 0.12s ease',
        transform: hov && !drag ? 'scale(1.02)' : 'scale(1)',
        userSelect:'none',
        animation:'slideUp 0.2s ease',
        position:'relative',
        overflow:'hidden',
      }}
    >
      {item.uploaded && (
        <div style={{
          position:'absolute',top:4,right:4,
          background:'var(--ok)',width:5,height:5,borderRadius:'50%',
        }}/>
      )}
      <div style={{
        width:'100%',height:48,
        background:item.bg,
        marginBottom:8,
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:22,
      }}>{item.icon}</div>
      <p style={{fontSize:11,color: hov ? '#F0F0F0' : '#CCCCCC',fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',fontFamily:"'Inter',sans-serif"}}>{item.name}</p>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────
function App() {
  const [gender, setGender]       = useState('UNISEX');
  const [activeCat, setActiveCat] = useState(null);
  const [activeSubcat, setActiveSubcat] = useState(null);
  const [expandedCat, setExpandedCat] = useState(null);
  const [search, setSearch]       = useState('');
  const [placed, setPlaced]       = useState([]);
  const [dragItem, setDragItem]   = useState(null);
  const [hoverZone, setHoverZone] = useState(null);
  const [toast, setToast]         = useState(null);
  const [replaceQ, setReplaceQ]   = useState(null);
  const [showGen, setShowGen]     = useState(false);
  const [credits, setCredits]     = useState(14);
  const [uploading, setUploading] = useState(false);
  const [uploadPct, setUploadPct] = useState(0);
  const [uploadedItems, setUploadedItems] = useState([]);
  const [doneState, setDoneState] = useState(false);
  const fileRef = useRef(null);
  const searchRef = useRef(null);

  const allItems = useMemo(() => [...WARDROBE, ...uploadedItems], [uploadedItems]);

  // Filter logic
  const filtered = useMemo(() => {
    let items = allItems;
    if (gender === 'UNISEX') {
      items = items.filter(i => i.gender === 'UNISEX');
    } else {
      items = items.filter(i => i.gender === gender || i.gender === 'UNISEX');
    }
    if (activeCat) items = items.filter(i => i.cat === activeCat);
    if (activeSubcat) items = items.filter(i => i.subcat === activeSubcat);
    if (search.trim()) {
      const q = search.toLowerCase();
      items = allItems.filter(i => {
        const gMatch = gender === 'UNISEX' ? i.gender === 'UNISEX' : i.gender === gender || i.gender === 'UNISEX';
        return gMatch && (i.name.toLowerCase().includes(q) || i.subcat.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q));
      });
    }
    return items;
  }, [allItems, gender, activeCat, activeSubcat, search]);

  const toast$ = useCallback((msg, type='warn') => setToast({ msg, type }), []);

  // Reset subcat when gender or cat changes
  useEffect(() => { setActiveSubcat(null); }, [gender, activeCat]);
  useEffect(() => { setActiveCat(null); setActiveSubcat(null); setExpandedCat(null); }, [gender]);


  const onDrop = useCallback((zone, e) => {
    e.preventDefault();
    setHoverZone(null);
    const id = e.dataTransfer.getData('itemId');
    const item = allItems.find(i => i.id === id);
    if (!item) return;

    // Hard block: use item's correct zone (dz) — item-level, not category-level
    if (item.dz !== zone) {
      toast$(`${item.name} belongs on ${item.dz} — drop it there.`, 'warn');
      return;
    }

    // Smart replacement: same non-accessory category in same zone
    const conflict = placed.find(p => p.zone === zone && p.item.cat === item.cat && item.cat !== 'ACCESSORIES');
    if (conflict) {
      setReplaceQ({ conflict, next: { item, zone } });
      return;
    }

    setPlaced(prev => [...prev, { id: Date.now() + Math.random(), item, zone }]);
  }, [placed, allItems, toast$]);

  const doReplace = () => {
    const { conflict, next } = replaceQ;
    setPlaced(prev => {
      const filtered = prev.filter(p => p.id !== conflict.id);
      return [...filtered, { id: Date.now(), item: next.item, zone: next.zone }];
    });
    setReplaceQ(null);
  };

  const doKeepBoth = () => {
    const { next } = replaceQ;
    setPlaced(prev => [...prev, { id: Date.now(), item: next.item, zone: next.zone }]);
    setReplaceQ(null);
  };

  const doRemove = id => setPlaced(prev => prev.filter(p => p.id !== id));

  // Upload + AI suggest state
  const [uploadMeta, setUploadMeta] = useState(null);
  const [upGender, setUpGender] = useState('UNISEX');
  const [upCat, setUpCat] = useState('TOPS');
  const [upSubcat, setUpSubcat] = useState('T-Shirt');
  const [showOverride, setShowOverride] = useState(false);

  const UP_CAT_MAP = {
    TOPS:        { dz:'TORSO', icon:'👕', subcats:['T-Shirt','Shirt','Hoodie','Jacket','Knitwear','Blazer'] },
    BOTTOMS:     { dz:'LEGS',  icon:'👖', subcats:['Jeans','Shorts','Trousers','Skirt','Dress'] },
    FOOTWEAR:    { dz:'FEET',  icon:'👟', subcats:['Sneakers','Boots','Flats','Heels'] },
    ACCESSORIES: { dz:'HEAD',  icon:'👜', subcats:['Headwear','Eyewear','Bag','Jewelry'] },
  };

  // AI classification from filename
  const aiGuess = (name) => {
    const n = name.toLowerCase();
    if (n.match(/jacket|coat|hoodie|blazer|cardigan|knitwear/)) return { cat:'TOPS', subcat:'Jacket', gender:'UNISEX' };
    if (n.match(/shirt|blouse/)) return { cat:'TOPS', subcat:'Shirt', gender:'UNISEX' };
    if (n.match(/tee|tshirt|top/)) return { cat:'TOPS', subcat:'T-Shirt', gender:'UNISEX' };
    if (n.match(/jeans|denim|pants|trousers/)) return { cat:'BOTTOMS', subcat:'Jeans', gender:'UNISEX' };
    if (n.match(/skirt/)) return { cat:'BOTTOMS', subcat:'Skirt', gender:'WOMEN' };
    if (n.match(/dress/)) return { cat:'BOTTOMS', subcat:'Dress', gender:'WOMEN' };
    if (n.match(/short/)) return { cat:'BOTTOMS', subcat:'Shorts', gender:'MEN' };
    if (n.match(/shoe|sneaker|boot|flat|heel/)) return { cat:'FOOTWEAR', subcat:'Sneakers', gender:'UNISEX' };
    if (n.match(/bag|tote|purse/)) return { cat:'ACCESSORIES', subcat:'Bag', gender:'WOMEN' };
    if (n.match(/cap|hat|beret/)) return { cat:'ACCESSORIES', subcat:'Headwear', gender:'UNISEX' };
    if (n.match(/glass|sunglass/)) return { cat:'ACCESSORIES', subcat:'Eyewear', gender:'UNISEX' };
    return { cat:'TOPS', subcat:'T-Shirt', gender:'UNISEX' };
  };

  const confirmUpload = () => {
    const cfg = UP_CAT_MAP[upCat];
    setUploadedItems(prev => [...prev, {
      id: 'up_' + Date.now(),
      name: uploadMeta.name,
      cat: upCat, subcat: upSubcat,
      gender: upGender,
      dz: cfg.dz,
      bg: '#C8FF00', fg: '#000',
      icon: cfg.icon,
      uploaded: true,
    }]);
    setUploadMeta(null);
    setShowOverride(false);
    toast$(`"${uploadMeta.name}" added to wardrobe.`, 'ok');
  };

  const doUpload = e => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    setUploadPct(0);
    const raw = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g,' ');
    const displayName = raw.slice(0, 22);
    let pct = 0;
    const iv = setInterval(() => {
      pct += Math.random() * 18 + 4;
      if (pct >= 100) {
        clearInterval(iv);
        setUploadPct(100);
        setTimeout(() => {
          const guess = aiGuess(raw);
          setUpCat(guess.cat);
          setUpSubcat(guess.subcat);
          setUpGender(guess.gender);
          setShowOverride(false);
          setUploading(false);
          setUploadPct(0);
          setUploadMeta({ name: displayName, guess });
        }, 300);
      } else {
        setUploadPct(Math.min(pct, 100));
      }
    }, 110);
    e.target.value = '';
  };

  const doGenerate = () => {
    if (placed.length === 0) { toast$('Add at least one item before generating.', 'warn'); return; }
    setShowGen(true);
  };

  const confirmGenerate = () => {
    setCredits(c => c - 2);
    setShowGen(false);
    setDoneState(true);
    setTimeout(() => setDoneState(false), 4000);
    toast$('Generation queued — results in ~30 seconds.', 'ok');
  };

  // Zone items helper
  const inZone = z => placed.filter(p => p.zone === z);

  return (
    <div style={{display:'flex',height:'100%',overflow:'hidden'}}>

      {/* ── LEFT SIDEBAR ───────────────────────────────── */}
      <div style={{
        width:'var(--sidebar)',flexShrink:0,
        background:'var(--surface)',
        borderRight:'1px solid var(--border-subtle)',
        display:'flex',flexDirection:'column',
        overflow:'hidden',
      }}>
        {/* Logo */}
        <div style={{
          padding:'16px 18px',
          borderBottom:'1px solid var(--border-subtle)',
          display:'flex',alignItems:'center',gap:10,
        }}>
          <div style={{width:30,height:30,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <span style={{fontSize:11,fontWeight:800,color:'#000',fontFamily:'Syne',letterSpacing:1}}>ST</span>
          </div>
          <span style={{fontSize:13,fontWeight:700,letterSpacing:4,color:'#DDDDDD',fontFamily:'Syne'}}>STITCH</span>
          <span style={{
            marginLeft:'auto',fontSize:8,color:'var(--accent)',
            background:'rgba(200,255,0,0.08)',
            padding:'2px 7px',letterSpacing:2,
            border:'1px solid rgba(200,255,0,0.2)',flexShrink:0,
          }}>BETA</span>
        </div>

        {/* Upload */}
        <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border-subtle)'}}>
          <p style={{fontSize:9,color:'#888',letterSpacing:3,marginBottom:10,fontWeight:600,fontFamily:"'JetBrains Mono',monospace"}}>HERO PRODUCT</p>

          {/* STATE 1: Processing */}
          {uploading && (
            <div style={{background:'#0E0E0E',border:'1px solid var(--border)',padding:'12px 14px'}}>
              <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
                <span style={{fontSize:10,color:'var(--accent)',animation:'spin 1s linear infinite',display:'inline-block'}}>⟳</span>
                <span style={{fontSize:10,color:'#AAA',fontFamily:"'Inter',sans-serif"}}>Removing background...</span>
              </div>
              <div style={{height:2,background:'#1A1A1A',width:'100%',overflow:'hidden',borderRadius:1}}>
                <div style={{height:'100%',background:'var(--accent)',width:uploadPct+'%',transition:'width 0.1s ease',boxShadow:'0 0 6px var(--accent-glow)'}}/>
              </div>
              <p style={{fontSize:8,color:'#555',marginTop:5,textAlign:'right',fontFamily:"'JetBrains Mono',monospace"}}>{Math.round(uploadPct)}%</p>
            </div>
          )}

          {/* STATE 2: AI Suggest */}
          {!uploading && uploadMeta && (
            <div style={{background:'#0E0E0E',border:'1px solid rgba(200,255,0,0.2)',padding:'14px',animation:'slideUp 0.2s ease'}}>
              {/* File + AI badge */}
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:12,paddingBottom:10,borderBottom:'1px solid #1A1A1A'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:14,color:'var(--ok)'}}>✓</span>
                  <div>
                    <p style={{fontSize:10,color:'#DDD',fontFamily:"'Inter',sans-serif",fontWeight:500}}>{uploadMeta.name}</p>
                    <p style={{fontSize:8,color:'#555',fontFamily:"'JetBrains Mono',monospace",marginTop:2}}>BG REMOVED</p>
                  </div>
                </div>
                <span style={{
                  fontSize:7,color:'var(--accent)',
                  background:'rgba(200,255,0,0.08)',
                  border:'1px solid rgba(200,255,0,0.2)',
                  padding:'2px 6px',letterSpacing:1,
                  fontFamily:"'JetBrains Mono',monospace",flexShrink:0,
                }}>AI TAGGED</span>
              </div>

              {/* AI suggestion display */}
              {!showOverride && (
                <>
                  <p style={{fontSize:8,color:'#555',letterSpacing:2,marginBottom:8,fontFamily:"'JetBrains Mono',monospace"}}>AI SUGGESTION</p>
                  <div style={{
                    display:'flex',gap:6,marginBottom:12,flexWrap:'wrap',
                  }}>
                    {[
                      { label: upCat, color:'var(--accent)' },
                      { label: upSubcat, color:'#CCC' },
                      { label: upGender, color:'#888' },
                    ].map((tag,i) => (
                      <span key={i} style={{
                        fontSize:9,padding:'3px 8px',
                        background: i===0 ? 'rgba(200,255,0,0.1)' : '#111',
                        border: `1px solid ${i===0 ? 'rgba(200,255,0,0.3)' : '#222'}`,
                        color: tag.color,
                        fontFamily:"'JetBrains Mono',monospace",
                        letterSpacing:1,
                      }}>{tag.label}</span>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:6}}>
                    <button onClick={confirmUpload} style={{
                      flex:1,background:'var(--accent)',color:'#000',border:'none',
                      padding:'9px 0',fontSize:9,fontFamily:"'JetBrains Mono',monospace",
                      fontWeight:700,cursor:'pointer',letterSpacing:1,
                    }}>✓ USE SUGGESTION</button>
                    <button onClick={() => setShowOverride(true)} style={{
                      background:'transparent',color:'#666',
                      border:'1px solid #222',
                      padding:'9px 10px',fontSize:9,fontFamily:"'Inter',sans-serif",
                      cursor:'pointer',
                    }}>Edit</button>
                    <button onClick={() => setUploadMeta(null)} style={{
                      background:'transparent',color:'#444',border:'1px solid #1A1A1A',
                      padding:'9px 10px',fontSize:12,cursor:'pointer',
                    }}>×</button>
                  </div>
                </>
              )}

              {/* Override panel */}
              {showOverride && (
                <div style={{animation:'slideUp 0.15s ease'}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                    <p style={{fontSize:8,color:'#888',letterSpacing:2,fontFamily:"'JetBrains Mono',monospace"}}>EDIT TAGS</p>
                    <button onClick={() => setShowOverride(false)} style={{background:'none',border:'none',color:'#444',cursor:'pointer',fontSize:10,fontFamily:"'Inter',sans-serif"}}>← back</button>
                  </div>

                  {/* Gender */}
                  <p style={{fontSize:8,color:'#555',letterSpacing:1,marginBottom:5,fontFamily:"'JetBrains Mono',monospace"}}>GENDER</p>
                  <div style={{display:'flex',gap:0,border:'1px solid #2A2A2A',overflow:'hidden',marginBottom:10}}>
                    {['UNISEX','MEN','WOMEN'].map((g,i) => (
                      <button key={g} onClick={() => setUpGender(g)} style={{
                        flex:1,background:upGender===g?'var(--accent)':'transparent',
                        color:upGender===g?'#000':'#666',border:'none',
                        borderLeft:i>0?'1px solid #2A2A2A':'none',
                        padding:'5px 0',fontSize:8,fontFamily:"'JetBrains Mono',monospace",
                        fontWeight:upGender===g?700:400,cursor:'pointer',
                      }}>{g}</button>
                    ))}
                  </div>

                  {/* Category */}
                  <p style={{fontSize:8,color:'#555',letterSpacing:1,marginBottom:5,fontFamily:"'JetBrains Mono',monospace"}}>CATEGORY</p>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginBottom:10}}>
                    {Object.entries(UP_CAT_MAP).map(([k,v]) => (
                      <button key={k} onClick={() => { setUpCat(k); setUpSubcat(v.subcats[0]); }} style={{
                        background:upCat===k?'rgba(200,255,0,0.1)':'transparent',
                        color:upCat===k?'var(--accent)':'#777',
                        border:`1px solid ${upCat===k?'rgba(200,255,0,0.3)':'#1E1E1E'}`,
                        padding:'5px 4px',fontSize:9,fontFamily:"'Inter',sans-serif",
                        cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:4,
                      }}>
                        <span>{v.icon}</span><span style={{fontSize:8}}>{k}</span>
                      </button>
                    ))}
                  </div>

                  {/* Subcat */}
                  <p style={{fontSize:8,color:'#555',letterSpacing:1,marginBottom:5,fontFamily:"'JetBrains Mono',monospace"}}>TYPE</p>
                  <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:12}}>
                    {UP_CAT_MAP[upCat].subcats.map(sc => (
                      <button key={sc} onClick={() => setUpSubcat(sc)} style={{
                        background:upSubcat===sc?'var(--accent)':'#111',
                        color:upSubcat===sc?'#000':'#777',
                        border:`1px solid ${upSubcat===sc?'transparent':'#1E1E1E'}`,
                        padding:'3px 8px',fontSize:9,fontFamily:"'Inter',sans-serif",cursor:'pointer',
                      }}>{sc}</button>
                    ))}
                  </div>

                  <div style={{display:'flex',gap:6}}>
                    <button onClick={confirmUpload} style={{
                      flex:1,background:'var(--accent)',color:'#000',border:'none',
                      padding:'9px 0',fontSize:9,fontFamily:"'JetBrains Mono',monospace",
                      fontWeight:700,cursor:'pointer',letterSpacing:1,
                    }}>ADD TO WARDROBE</button>
                    <button onClick={() => setUploadMeta(null)} style={{
                      background:'transparent',color:'#444',border:'1px solid #1A1A1A',
                      padding:'9px 10px',fontSize:12,cursor:'pointer',
                    }}>×</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* STATE 3: Idle */}
          {!uploading && !uploadMeta && (
            <div onClick={() => fileRef.current?.click()}
              style={{border:'1px dashed #2A2A2A',padding:'14px 12px',textAlign:'center',cursor:'pointer',transition:'all 0.15s ease'}}
              onMouseEnter={e => { e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.background='rgba(200,255,0,0.02)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor='#2A2A2A'; e.currentTarget.style.background='transparent'; }}
            >
              <span style={{fontSize:22,display:'block',marginBottom:6,color:'#666'}}>↑</span>
              <p style={{fontSize:13,color:'#CCCCCC',fontWeight:500,fontFamily:"'Inter',sans-serif"}}>Upload Product</p>
              <p style={{fontSize:10,color:'#666',marginTop:4,fontFamily:"'Inter',sans-serif"}}>JPG, PNG · max 10MB</p>
            </div>
          )}
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={doUpload}/>
        </div>

        {/* Gender Toggle */}
        <div style={{padding:'10px 16px',borderBottom:'1px solid var(--border-subtle)'}}>
          <p style={{fontSize:9,color:'#666',letterSpacing:3,marginBottom:8,fontFamily:"'JetBrains Mono',monospace",fontWeight:600}}>GENDER</p>
          <div style={{display:'flex',gap:0,border:'1px solid #2A2A2A',overflow:'hidden'}}>

                background: gender===g ? 'var(--accent)' : 'transparent',

                fontSize:9,fontFamily:"'JetBrains Mono',monospace",
                fontWeight: gender===g ? 700 : 500,
                cursor:'pointer',letterSpacing:1,
                transition:'all 0.12s ease',
              }}>{g}</button>
            ))}
          </div>
        </div>

        {/* Search */}
        <div style={{padding:'10px 16px',borderBottom:'1px solid var(--border-subtle)'}}>
          <div style={{
            display:'flex',alignItems:'center',gap:8,
            background:'#0E0E0E',border:'1px solid #2A2A2A',
            padding:'8px 12px',
          }}>
            <span style={{color:'#555',fontSize:12,flexShrink:0}}>🔍</span>
            <input
              ref={searchRef}
              value={search}
              onChange={e => setSearch(e.target.value)}
              placeholder="Search items..."
              style={{
                background:'none',border:'none',outline:'none',
                color:'#DDD',fontSize:12,fontFamily:"'Inter',sans-serif",
                flex:1,
              }}
            />
            {search && (
              <button onClick={() => setSearch('')} style={{
                background:'none',border:'none',color:'#555',
                cursor:'pointer',fontSize:14,padding:0,lineHeight:1,
              }}>×</button>
            )}
          </div>
        </div>

        {/* Category Accordion */}
        {!search && (
          <div style={{borderBottom:'1px solid var(--border-subtle)'}}>
            {Object.entries(CAT_GROUPS).map(([catKey, catCfg]) => {
              const subcats = catCfg.subcats[gender] || [];
              const isExpanded = expandedCat === catKey;
              const isActive = activeCat === catKey;
              const catCount = filtered.filter(i => i.cat === catKey).length;

              return (
                <div key={catKey}>
                  {/* Cat row */}
                  <div
                    onClick={() => {
                      if (isActive) { setActiveCat(null); setExpandedCat(null); }
                      else { setActiveCat(catKey); setExpandedCat(catKey); setActiveSubcat(null); }
                    }}
                    style={{
                      display:'flex',alignItems:'center',justifyContent:'space-between',
                      padding:'9px 16px',cursor:'pointer',
                      background: isActive ? 'rgba(200,255,0,0.05)' : 'transparent',
                      borderBottom:'1px solid #111',
                      transition:'background 0.12s',
                    }}
                    onMouseEnter={e => { if(!isActive) e.currentTarget.style.background='#0E0E0E'; }}
                    onMouseLeave={e => { if(!isActive) e.currentTarget.style.background='transparent'; }}
                  >
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <span style={{
                        fontSize:11,fontWeight:600,
                        color: isActive ? 'var(--accent)' : '#CCC',
                        fontFamily:"'Inter',sans-serif",
                      }}>{catCfg.label}</span>
                      <span style={{
                        fontSize:8,color: isActive ? 'var(--accent)' : '#555',
                        fontFamily:"'JetBrains Mono',monospace",
                      }}>{catCount}</span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      {isActive && (
                        <span style={{
                          fontSize:7,color:'var(--accent)',
                          fontFamily:"'JetBrains Mono',monospace",
                          letterSpacing:1,

                      {subcats.length > 0 && (
                        <span style={{
                          color: isActive ? 'var(--accent)' : '#444',
                          fontSize:10,
                          transform: isExpanded ? 'rotate(90deg)' : 'rotate(0deg)',
                          transition:'transform 0.2s ease',
                          display:'inline-block',
                        }}>›</span>
                      )}
                    </div>
                  </div>

                  {/* Subcats */}
                  {isExpanded && subcats.length > 0 && (
                    <div style={{background:'#080808',borderBottom:'1px solid #111'}}>
                      {subcats.map(sc => (
                        <div key={sc}
                          onClick={e => {
                            e.stopPropagation();
                            setActiveSubcat(activeSubcat === sc ? null : sc);
                          }}
                          style={{
                            display:'flex',alignItems:'center',justifyContent:'space-between',
                            padding:'7px 16px 7px 28px',
                            cursor:'pointer',
                            background: activeSubcat === sc ? 'rgba(200,255,0,0.08)' : 'transparent',
                            borderBottom:'1px solid #0E0E0E',
                            transition:'background 0.1s',
                          }}
                          onMouseEnter={e => { if(activeSubcat!==sc) e.currentTarget.style.background='#111'; }}
                          onMouseLeave={e => { if(activeSubcat!==sc) e.currentTarget.style.background='transparent'; }}
                        >
                          <span style={{
                            fontSize:11,
                            color: activeSubcat===sc ? 'var(--accent)' : '#999',
                            fontFamily:"'Inter',sans-serif",

                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* Search result label */}
        {search && (
          <div style={{padding:'8px 16px',borderBottom:'1px solid #111'}}>
            <span style={{fontSize:9,color:'#666',fontFamily:"'JetBrains Mono',monospace",letterSpacing:1}}>
              {filtered.length} RESULT{filtered.length!==1?'S':''} FOR "{search.toUpperCase()}"
            </span>
          </div>
        )}

        {/* Wardrobe Grid */}
        <div style={{flex:1,overflowY:'auto',padding:'12px 16px',alignContent:'start'}}>
          {filtered.length === 0 ? (
            <div style={{padding:'32px 16px',textAlign:'center'}}>
              <p style={{fontSize:12,color:'#444',fontFamily:"'Inter',sans-serif",lineHeight:1.8}}>
                No items found.<br/>
                <span style={{fontSize:10,color:'#333'}}>Try a different search</span>
              </p>
            </div>
          ) : !activeCat && !search ? (
            // Grouped by category (default ALL view)
            Object.entries(CAT_GROUPS).map(([catKey, catCfg]) => {
              const groupItems = filtered.filter(i => i.cat === catKey);
              if (groupItems.length === 0) return null;
              return (
                <div key={catKey} style={{marginBottom:18}}>
                  <p style={{
                    fontSize:9,color:'#666',letterSpacing:3,fontWeight:600,
                    marginBottom:8,paddingBottom:6,
                    borderBottom:'1px solid #1A1A1A',
                    fontFamily:"'JetBrains Mono',monospace",
                  }}>{catCfg.label.toUpperCase()}</p>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                    {groupItems.map(item => (
                      <Item key={item.id} item={item}
                        onDragStart={setDragItem}
                        onDragEnd={() => setDragItem(null)}
                      />
                    ))}
                  </div>
                </div>
              );
            })
          ) : (
            // Filtered flat grid
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {filtered.map(item => (
                <Item key={item.id} item={item}
                  onDragStart={setDragItem}
                  onDragEnd={() => setDragItem(null)}
                />
              ))}
            </div>
          )}
        </div>
      </div>

      {/* ── CENTER CANVAS ──────────────────────────────── */}
      <div style={{
        flex:1,
        position:'relative',
        display:'flex',alignItems:'center',justifyContent:'center',
        background:'var(--bg)',
        backgroundImage:`
          radial-gradient(ellipse 380px 560px at 50% 46%, rgba(255,255,255,0.025) 0%, transparent 70%),
          linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px)
        `,
        backgroundSize:'100% 100%, 44px 44px, 44px 44px',
        overflow:'hidden',
      }}>
        {/* Corner labels */}
        <div style={{position:'absolute',top:18,left:22,display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:9,color:'#555',letterSpacing:3,fontWeight:600}}>CANVAS</span>
          {placed.length > 0 && (
            <>
              <span style={{width:3,height:3,background:'#444',borderRadius:'50%',display:'inline-block'}}/>
              <span style={{fontSize:9,color:'#888',letterSpacing:2}}>{placed.length} ITEM{placed.length!==1?'S':''}</span>
            </>
          )}
        </div>

        {/* Mannequin + Drop zones container */}
        <div style={{position:'relative',width:220,height:520}}>
          <Mannequin/>

          {/* ── GARMENT OVERLAYS (visual representation) ── */}
          {ZONES.map(zone => {
            const cfg = ZONE_CFG[zone];
            const items = inZone(zone);
            const ov = cfg.ov;
            return items.map((p, idx) => {
              const stackOffset = idx * 3;
              const isTop = idx === items.length - 1;
              return (
                <div key={p.id} style={{
                  position:'absolute',
                  top: ov.top + stackOffset,
                  left: ov.left - stackOffset,
                  width: ov.width,
                  height: ov.height,
                  background: p.item.bg,
                  borderRadius: ov.radius,
                  opacity: isTop ? 0.82 : 0.5,
                  display:'flex',
                  flexDirection:'column',
                  alignItems:'center',
                  justifyContent:'center',
                  gap:6,
                  zIndex: 10 + idx,
                  animation:'dropIn 0.25s cubic-bezier(.2,.8,.4,1)',
                  boxShadow: isTop
                    ? '0 4px 24px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08)'
                    : '0 2px 8px rgba(0,0,0,0.5)',
                  border: isTop
                    ? '1px solid rgba(255,255,255,0.1)'
                    : '1px solid rgba(255,255,255,0.04)',
                  pointerEvents:'none',
                  transition:'all 0.2s ease',
                }}>
                  <span style={{fontSize: zone==='HEAD'?22:zone==='FEET'?20:28, lineHeight:1}}>{p.item.icon}</span>
                  {zone !== 'HEAD' && zone !== 'FEET' && (
                    <span style={{
                      fontSize:9,
                      color: p.item.fg || 'rgba(255,255,255,0.5)',
                      fontFamily:"'JetBrains Mono',monospace",
                      letterSpacing:1,
                      fontWeight:600,
                      textAlign:'center',
                      padding:'0 8px',
                      overflow:'hidden',
                      textOverflow:'ellipsis',
                      whiteSpace:'nowrap',
                      width:'100%',
                    }}>{p.item.name.toUpperCase()}</span>
                  )}
                </div>
              );
            });
          })}

          {/* ── DROP ZONES (interaction layer, above overlays) ── */}
          {ZONES.map(zone => {
            const cfg = ZONE_CFG[zone];
            const isHov = hoverZone === zone;
            const showLabel = dragItem || isHov;

            // Determine if current drag item is valid for this zone
            const isValid = dragItem ? dragItem.dz === zone : true;
            const isBlocked = isHov && !isValid;
            const isAccepted = isHov && isValid;

            return (
              <div
                key={zone}
                onDragOver={e => { e.preventDefault(); setHoverZone(zone); }}
                onDragLeave={() => setHoverZone(null)}
                onDrop={e => onDrop(zone, e)}
                style={{
                  position:'absolute',
                  top:cfg.top, left:0, right:0,
                  height:cfg.h,
                  border: isBlocked
                    ? '1px solid rgba(255,64,64,0.6)'
                    : isAccepted ? '1px solid rgba(200,255,0,0.6)' : '1px solid transparent',
                  background: isBlocked
                    ? 'rgba(255,64,64,0.06)'
                    : isAccepted ? 'rgba(200,255,0,0.07)' : 'transparent',
                  boxShadow: isBlocked
                    ? '0 0 24px rgba(255,64,64,0.1) inset'
                    : isAccepted ? '0 0 28px rgba(200,255,0,0.12) inset' : 'none',
                  transition:'all 0.15s ease',
                  zIndex: 20,
                }}
              >
                {/* Zone label on right */}
                {showLabel && (
                  <div style={{
                    position:'absolute',
                    right:-96, top:'50%', transform:'translateY(-50%)',
                    display:'flex', flexDirection:'column', gap:3,
                  }}>
                    <span style={{
                      fontSize:9, letterSpacing:2, fontWeight:600,
                      color: isBlocked ? 'var(--red)' : isAccepted ? 'var(--accent)' : '#333',
                      whiteSpace:'nowrap',
                      fontFamily:"'JetBrains Mono',monospace",
                    }}>{zone}</span>
                    {isHov && (
                      <span style={{
                        fontSize:8,whiteSpace:'nowrap',fontFamily:"'Inter',sans-serif",
                        color: isBlocked ? 'rgba(255,64,64,0.6)' : '#555',
                      }}>{isBlocked ? `Belongs on ${dragItem?.dz}` : cfg.hint}</span>
                    )}
                  </div>
                )}

                {/* Drop indicator */}
                {isHov && (
                  <div style={{
                    position:'absolute', inset:4,
                    border: isBlocked
                      ? '1px dashed rgba(255,64,64,0.3)'
                      : '1px dashed rgba(200,255,0,0.3)',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    pointerEvents:'none',
                  }}>
                    <span style={{
                      fontSize:9,
                      color: isBlocked ? 'rgba(255,64,64,0.5)' : 'rgba(200,255,0,0.5)',
                      fontFamily:"'JetBrains Mono',monospace",
                      letterSpacing:2,
                    }}>{isBlocked ? '✕ BLOCKED' : 'DROP HERE'}</span>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Empty hint */}
        {placed.length === 0 && !dragItem && (
          <div style={{
            position:'absolute',bottom:28,left:'50%',transform:'translateX(-50%)',
            textAlign:'center',pointerEvents:'none',
          }}>
            <p style={{fontSize:9,color:'#222',letterSpacing:3}}>← DRAG FROM WARDROBE TO DRESS</p>
          </div>
        )}

        {/* Drag hint glow on canvas during drag */}
        {dragItem && (
          <div style={{
            position:'absolute',inset:0,pointerEvents:'none',
            background:'radial-gradient(circle at 50% 50%, rgba(200,255,0,0.03) 0%, transparent 60%)',
            animation:'pulse 1.5s ease infinite',
          }}/>
        )}
      </div>

      {/* ── RIGHT PANEL ───────────────────────────────── */}
      <div style={{
        width:'var(--right)',flexShrink:0,
        background:'var(--surface)',
        borderLeft:'1px solid var(--border-subtle)',
        display:'flex',flexDirection:'column',
        overflow:'hidden',
      }}>
        {/* Header */}
        <div style={{padding:'16px 18px',borderBottom:'1px solid var(--border-subtle)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
            <p style={{fontSize:9,color:'#888',letterSpacing:3,fontWeight:600}}>LAYERS</p>
            <span style={{fontSize:10,color:'#666',fontWeight:500}}>{placed.length} / 8</span>
          </div>
          {placed.length > 0 && (
            <div style={{
              marginTop:8,height:2,background:'#1A1A1A',borderRadius:1,overflow:'hidden',
            }}>
              <div style={{
                height:'100%',width: (placed.length/8*100) + '%',
                background:'var(--accent)',
                transition:'width 0.3s ease',
                boxShadow:'0 0 4px var(--accent-glow)',
              }}/>
            </div>
          )}
        </div>

        {/* Layers */}
        <div style={{flex:1,overflowY:'auto',padding:'8px 0'}}>
          {placed.length === 0 ? (
            <div style={{
              margin:'16px',
              border:'1px dashed #2A2A2A',
              padding:'28px 16px',
              textAlign:'center',
            }}>
              <p style={{fontSize:10,color:'#555',lineHeight:1.9,fontFamily:"'Inter',sans-serif"}}>
                No items yet.<br/>Drag from wardrobe.
              </p>
            </div>
          ) : (
            placed.map((p, i) => (
              <div key={p.id} style={{
                display:'flex',alignItems:'center',gap:10,
                padding:'9px 16px',
                borderBottom:'1px solid #111',
                transition:'background 0.1s ease',
                animation:'slideUp 0.18s ease',
              }}
                onMouseEnter={e => e.currentTarget.style.background='#111'}
                onMouseLeave={e => e.currentTarget.style.background='transparent'}
              >
                <div style={{
                  width:28,height:22,background:p.item.bg,flexShrink:0,
                  display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,
                }}>{p.item.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{fontSize:12,color:'#EEEEEE',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:500,fontFamily:"'Inter',sans-serif"}}>{p.item.name}</p>
                  <p style={{fontSize:8,color:'#666',marginTop:3,letterSpacing:1,fontFamily:"'JetBrains Mono',monospace"}}>{p.zone} · {p.item.cat}</p>
                </div>
                <button
                  onClick={() => doRemove(p.id)}
                  style={{
                    background:'none',border:'none',color:'#444',
                    cursor:'pointer',fontSize:18,padding:0,lineHeight:1,
                    transition:'color 0.1s',flexShrink:0,
                  }}
                  onMouseEnter={e => e.currentTarget.style.color='var(--red)'}
                  onMouseLeave={e => e.currentTarget.style.color='#444'}
                >×</button>
              </div>
            ))
          )}
        </div>

        {/* Generate section */}
        <div style={{padding:16,borderTop:'1px solid var(--border-subtle)',background:'#080808'}}>
          {/* Credits display */}
          <div style={{
            display:'flex',justifyContent:'space-between',alignItems:'center',
            marginBottom:14,padding:'8px 12px',
            background:'#0A0A0A',border:'1px solid #222',
          }}>
            <div style={{display:'flex',gap:7,alignItems:'center'}}>
              <span style={{color:'var(--accent)',fontSize:13}}>⚡</span>
              <span style={{fontSize:10,color:'#888',letterSpacing:2,fontWeight:600,fontFamily:"'JetBrains Mono',monospace"}}>CREDITS</span>
            </div>
            <span style={{fontSize:20,fontWeight:700,color: credits > 4 ? '#F0F0F0' : 'var(--warn)',fontFamily:"'JetBrains Mono',monospace"}}>{credits}</span>
          </div>

          {/* Generate CTA */}
          <button
            onClick={doGenerate}
            style={{
              width:'100%',
              background: doneState ? 'var(--ok)' : placed.length > 0 ? 'var(--accent)' : '#111',
              color: doneState ? '#000' : placed.length > 0 ? '#000' : '#444',
              border: placed.length > 0 ? 'none' : '1px solid #2A2A2A',
              padding:'14px 0',
              fontSize:11,fontFamily:'JetBrains Mono',fontWeight:700,
              cursor: placed.length > 0 ? 'pointer' : 'not-allowed',
              letterSpacing:2,
              transition:'all 0.2s ease',
              boxShadow: placed.length > 0 && !doneState ? '0 0 20px rgba(200,255,0,0.15)' : 'none',
            }}
          >
            {doneState ? '✓ SENT TO AI' : '⚡ GENERATE LOOK'}
          </button>

          {placed.length > 0 && !doneState && (
            <p style={{fontSize:10,color:'#666',textAlign:'center',marginTop:8,fontFamily:"'Inter',sans-serif"}}>
              2 credits · results in ~30 seconds
            </p>
          )}
        </div>
      </div>

      {/* ── OVERLAYS ──────────────────────────────────── */}
      {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)}/>}

      {replaceQ && (
        <ReplaceModal
          cur={replaceQ.conflict.item}
          next={replaceQ.next.item}
          onReplace={doReplace}
          onKeepBoth={doKeepBoth}
          onCancel={() => setReplaceQ(null)}
        />
      )}

      {showGen && (
        <GenerateModal
          placed={placed.map(p => ({ name: p.item.name, zone: p.zone, icon: p.item.icon }))}
          credits={credits}
          onConfirm={confirmGenerate}
          onCancel={() => setShowGen(false)}
        />
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
