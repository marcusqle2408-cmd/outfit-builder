<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050505;
  --surface:#0C0C0C;
  --surface-2:#111;
  --surface-3:#161616;
  --border:#1E1E1E;
  --border-subtle:#141414;
  --text:#E2E2E2;
  --text-muted:#666;
  --text-dim:#333;
  --accent:#C8FF00;
  --accent-dim:rgba(200,255,0,0.12);
  --accent-glow:rgba(200,255,0,0.25);
  --warn:#FF6B35;
  --warn-dim:rgba(255,107,53,0.15);
  --ok:#00E5A0;
  --ok-dim:rgba(0,229,160,0.12);
  --red:#FF4040;
  --sidebar:272px;
  --right:252px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px}
#root{height:100%}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1E1E1E;border-radius:2px}

@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastSlide{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes glow{0%,100%{box-shadow:0 0 12px var(--accent-glow)}50%{box-shadow:0 0 24px var(--accent-glow),0 0 40px var(--accent-dim)}}
@keyframes dropIn{from{transform:scale(0.8) translateY(-8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ─── TOAST ────────────────────────────────────────────────────────
function Toast({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3800); return () => clearTimeout(t); }, []);
  const isWarn = type === 'warn';
  const accent = isWarn ? 'var(--warn)' : 'var(--ok)';
  return (
    <div style={{
      position:'fixed', bottom:28, right:28, zIndex:9999,
      background:'#0E0E0E', border:`1px solid ${accent}`,
      borderLeft:`3px solid ${accent}`,
      padding:'12px 16px', maxWidth:300, minWidth:240,
      animation:'toastSlide 0.3s cubic-bezier(.2,.8,.4,1)',
      boxShadow:'0 8px 32px rgba(0,0,0,0.6)',
    }}>
      <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
        <span style={{color:accent,fontSize:13,flexShrink:0,marginTop:1}}>{isWarn ? '⚠' : '✓'}</span>
        <p style={{fontSize:10,color:'#CCC',lineHeight:1.6,flex:1}}>{msg}</p>
        <button onClick={onClose} style={{background:'none',border:'none',color:'#444',cursor:'pointer',fontSize:16,lineHeight:1,padding:0,flexShrink:0}}>×</button>
      </div>
    </div>
  );
}

// ─── REPLACE MODAL ────────────────────────────────────────────────
function ReplaceModal({ cur, next, onReplace, onKeepBoth, onCancel }) {
  return (
    <div style={{
      position:'fixed',inset:0,background:'rgba(0,0,0,0.82)',
      zIndex:9998,display:'flex',alignItems:'center',justifyContent:'center',
      animation:'fadeIn 0.2s ease',
    }}>
      <div style={{
        background:'#0A0A0A',border:'1px solid #282828',
        padding:28,width:340,
        boxShadow:'0 24px 80px rgba(0,0,0,0.9)',
        animation:'slideUp 0.2s ease',
      }}>
        <p style={{fontSize:9,color:'#444',letterSpacing:3,marginBottom:10}}>ZONE CONFLICT</p>
        <p style={{fontSize:13,color:'#DDD',lineHeight:1.7,marginBottom:24,fontFamily:'Syne',fontWeight:600}}>
          Replace <span style={{color:'var(--accent)'}}>{cur.name}</span><br/>
          with <span style={{color:'var(--accent)'}}>{next.name}</span>?
        </p>
        <div style={{
          background:'#111',border:'1px solid #1A1A1A',
          padding:'10px 14px',marginBottom:24,

        }}>
          <div style={{textAlign:'center',flex:1}}>
            <div style={{width:36,height:28,background:cur.bg,margin:'0 auto 6px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>{cur.icon}</div>
            <p style={{fontSize:9,color:'#666'}}>{cur.name}</p>

          <div style={{textAlign:'center',flex:1}}>

// ─── GENERATE MODAL ───────────────────────────────────────────────
function GenerateModal({ placed, credits, onConfirm, onCancel }) {

        background:'#080808',border:'1px solid #222',

        animation:'slideUp 0.25s ease',

          <div style={{width:32,height:32,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center'}}>

          <div>
            <p style={{fontSize:9,color:'#555',letterSpacing:3}}>CONFIRM GENERATION</p>

        <div style={{background:'#0E0E0E',border:'1px solid #1A1A1A',padding:16,marginBottom:16}}>

        <div style={{display:'flex',gap:10}}>

// ─── WARDROBE ITEM ────────────────────────────────────────────────
function Item({ item, onDragStart, onDragEnd }) {
  const [hov, setHov] = useState(false);
  const [drag, setDrag] = useState(false);
  return (
    <div
      draggable
      onDragStart={e => {
        setDrag(true);
        e.dataTransfer.setData('itemId', item.id);
        e.dataTransfer.effectAllowed = 'copy';
        onDragStart(item);
      }}
      onDragEnd={() => { setDrag(false); onDragEnd(); }}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        background: hov ? '#151515' : '#0E0E0E',
        border: `1px solid ${hov ? 'var(--accent)' : '#1A1A1A'}`,
        padding:'10px',
        cursor:'grab',
        opacity: drag ? 0.4 : 1,
        transition:'all 0.12s ease',
        transform: hov && !drag ? 'scale(1.02)' : 'scale(1)',
        userSelect:'none',
        animation:'slideUp 0.2s ease',
        position:'relative',
        overflow:'hidden',
      }}
    >
      {item.uploaded && (
        <div style={{
          position:'absolute',top:4,right:4,
          background:'var(--ok)',width:5,height:5,borderRadius:'50%',
        }}/>
      )}
      <div style={{
        width:'100%',height:48,
        background:item.bg,
        marginBottom:8,
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:22,
      }}>{item.icon}</div>
      <p style={{fontSize:9,color: hov ? '#E8E8E8' : '#AAA',fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{item.name}</p>
      <p style={{fontSize:8,color:'#444',marginTop:2}}>{item.cat}</p>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────
function App() {
  const [cat, setCat]         = useState('ALL');
  const [placed, setPlaced]   = useState([]);
  const [dragItem, setDragItem] = useState(null);
  const [hoverZone, setHoverZone] = useState(null);
  const [toast, setToast]     = useState(null);
  const [replaceQ, setReplaceQ] = useState(null);
  const [showGen, setShowGen] = useState(false);
  const [credits, setCredits] = useState(14);
  const [uploading, setUploading] = useState(false);
  const [uploadPct, setUploadPct] = useState(0);
  const [uploadedItems, setUploadedItems] = useState([]);
  const [doneState, setDoneState] = useState(false);
  const fileRef = useRef(null);

  const allItems = useMemo(() => [...WARDROBE, ...uploadedItems], [uploadedItems]);
  const filtered = cat === 'ALL' ? allItems : allItems.filter(i => i.cat === cat);

  const toast$ = useCallback((msg, type='warn') => setToast({ msg, type }), []);

  const onDrop = useCallback((zone, e) => {
    e.preventDefault();
    setHoverZone(null);
    const id = e.dataTransfer.getData('itemId');
    const item = allItems.find(i => i.id === id);
    if (!item) return;

    // Soft zone warning
    const ok = CORRECT[item.cat] || ZONES;
    if (!ok.includes(zone)) {
      toast$(`Heads up — "${item.name}" usually goes on ${item.dz}. Placing here anyway.`, 'warn');
    }

    // Smart replacement: same non-accessory category in same zone
    const conflict = placed.find(p => p.zone === zone && p.item.cat === item.cat && item.cat !== 'ACCESSORIES');
    if (conflict) {
      setReplaceQ({ conflict, next: { item, zone } });
      return;
    }

    setPlaced(prev => [...prev, { id: Date.now() + Math.random(), item, zone }]);
  }, [placed, allItems, toast$]);

  const doReplace = () => {
    const { conflict, next } = replaceQ;
    setPlaced(prev => {
      const filtered = prev.filter(p => p.id !== conflict.id);
      return [...filtered, { id: Date.now(), item: next.item, zone: next.zone }];
    });
    setReplaceQ(null);
  };

  const doKeepBoth = () => {
    const { next } = replaceQ;
    setPlaced(prev => [...prev, { id: Date.now(), item: next.item, zone: next.zone }]);
    setReplaceQ(null);
  };

  const doRemove = id => setPlaced(prev => prev.filter(p => p.id !== id));

  const doUpload = e => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    setUploadPct(0);
    let pct = 0;
    const iv = setInterval(() => {
      pct += Math.random() * 18 + 4;
      if (pct >= 100) {
        clearInterval(iv);
        pct = 100;
        setUploadPct(100);
        setTimeout(() => {
          const name = file.name.replace(/\.[^.]+$/, '').slice(0, 16);
          setUploadedItems(prev => [...prev, {
            id: 'up_' + Date.now(),
            name, cat:'TOPS', dz:'TORSO',
            bg:'#C8FF00', fg:'#000', icon:'⬆',
            uploaded: true,
          }]);
          setUploading(false);
          setUploadPct(0);
          toast$(`"${name}" is ready — drag onto canvas.`, 'ok');
        }, 300);
      } else {
        setUploadPct(Math.min(pct, 100));
      }
    }, 110);
    e.target.value = '';
  };

  const doGenerate = () => {
    if (placed.length === 0) { toast$('Add at least one item before generating.', 'warn'); return; }
    setShowGen(true);
  };

  const confirmGenerate = () => {
    setCredits(c => c - 2);
    setShowGen(false);
    setDoneState(true);
    setTimeout(() => setDoneState(false), 4000);
    toast$('Generation queued — results in ~30 seconds.', 'ok');
  };

  // Zone items helper
  const inZone = z => placed.filter(p => p.zone === z);

  return (
    <div style={{display:'flex',height:'100%',overflow:'hidden'}}>

      {/* ── LEFT SIDEBAR ───────────────────────────────── */}
      <div style={{
        width:'var(--sidebar)',flexShrink:0,
        background:'var(--surface)',
        borderRight:'1px solid var(--border-subtle)',
        display:'flex',flexDirection:'column',
        overflow:'hidden',
      }}>
        {/* Logo */}
        <div style={{
          padding:'16px 18px',
          borderBottom:'1px solid var(--border-subtle)',
          display:'flex',alignItems:'center',gap:10,
        }}>
          <div style={{width:30,height:30,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <span style={{fontSize:11,fontWeight:800,color:'#000',fontFamily:'Syne',letterSpacing:1}}>ST</span>
          </div>
          <span style={{fontSize:11,fontWeight:700,letterSpacing:4,color:'#666',fontFamily:'Syne'}}>STITCH</span>
          <span style={{
            marginLeft:'auto',fontSize:7,color:'var(--accent)',
            background:'rgba(200,255,0,0.08)',
            padding:'2px 7px',letterSpacing:2,
            border:'1px solid rgba(200,255,0,0.2)',flexShrink:0,
          }}>BETA</span>
        </div>

        {/* Upload */}
        <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border-subtle)'}}>
          <p style={{fontSize:8,color:'#444',letterSpacing:3,marginBottom:10}}>HERO PRODUCT</p>
          {uploading ? (
            <div style={{background:'#0E0E0E',border:'1px solid var(--border)',padding:'12px 14px'}}>
              <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
                <span style={{fontSize:10,color:'var(--accent)',animation:'spin 1s linear infinite',display:'inline-block'}}>⟳</span>
                <span style={{fontSize:9,color:'#888'}}>Removing background...</span>
              </div>
              <div style={{height:2,background:'#1A1A1A',width:'100%',overflow:'hidden',borderRadius:1}}>
                <div style={{
                  height:'100%',background:'var(--accent)',
                  width: uploadPct + '%',
                  transition:'width 0.1s ease',
                  boxShadow:'0 0 6px var(--accent-glow)',
                }}/>
              </div>
              <p style={{fontSize:8,color:'#444',marginTop:5,textAlign:'right'}}>{Math.round(uploadPct)}%</p>
            </div>
          ) : (
            <div
              onClick={() => fileRef.current?.click()}
              style={{
                border:'1px dashed #1E1E1E',padding:'14px 12px',
                textAlign:'center',cursor:'pointer',transition:'all 0.15s ease',
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.background='rgba(200,255,0,0.02)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor='#1E1E1E'; e.currentTarget.style.background='transparent'; }}
            >
              <span style={{fontSize:20,display:'block',marginBottom:6,color:'#444'}}>↑</span>
              <p style={{fontSize:10,color:'#777'}}>Upload Product</p>
              <p style={{fontSize:8,color:'#444',marginTop:3}}>JPG, PNG · max 10MB</p>
            </div>
          )}
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={doUpload}/>
        </div>

        {/* Category tabs */}
        <div style={{
          padding:'10px 16px',
          borderBottom:'1px solid var(--border-subtle)',
          display:'flex',gap:4,flexWrap:'wrap',
        }}>
          {CATS.map(c => (
            <button key={c} onClick={() => setCat(c)} style={{
              background: cat===c ? 'var(--accent)' : '#0E0E0E',
              color: cat===c ? '#000' : '#555',
              border: cat===c ? 'none' : '1px solid #1A1A1A',
              padding:'4px 8px',fontSize:8,fontFamily:'JetBrains Mono',
              cursor:'pointer',letterSpacing:1,fontWeight: cat===c ? 700 : 400,
              transition:'all 0.12s ease',
            }}>{c==='ACCESSORIES'?'ACC':c}</button>
          ))}
        </div>

        {/* Wardrobe grid */}
        <div style={{
          flex:1,overflowY:'auto',padding:'12px 16px',
          display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,
          alignContent:'start',
        }}>
          {filtered.map(item => (
            <Item key={item.id} item={item}
              onDragStart={setDragItem}
              onDragEnd={() => setDragItem(null)}
            />
          ))}
          {filtered.length === 0 && (
            <div style={{gridColumn:'1/-1',padding:'24px 0',textAlign:'center'}}>
              <p style={{fontSize:9,color:'#333'}}>No items in this category</p>
            </div>
          )}
        </div>
      </div>

      {/* ── CENTER CANVAS ──────────────────────────────── */}
      <div style={{
        flex:1,
        position:'relative',
        display:'flex',alignItems:'center',justifyContent:'center',
        background:'var(--bg)',
        backgroundImage:`
          linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px)
        `,
        backgroundSize:'44px 44px',
        overflow:'hidden',
      }}>
        {/* Corner labels */}
        <div style={{position:'absolute',top:18,left:22,display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:8,color:'#222',letterSpacing:3}}>CANVAS</span>
          {placed.length > 0 && (
            <>
              <span style={{width:3,height:3,background:'#2A2A2A',borderRadius:'50%',display:'inline-block'}}/>
              <span style={{fontSize:8,color:'#2A2A2A',letterSpacing:2}}>{placed.length} ITEM{placed.length!==1?'S':''}</span>
            </>
          )}
        </div>

        {/* Mannequin + Drop zones container */}
        <div style={{position:'relative',width:220,height:520}}>
          <Mannequin/>

          {ZONES.map(zone => {
            const cfg = ZONE_CFG[zone];
            const isHov = hoverZone === zone;
            const items = inZone(zone);
            const showLabel = dragItem || isHov;

            return (
              <div
                key={zone}
                onDragOver={e => { e.preventDefault(); setHoverZone(zone); }}
                onDragLeave={() => setHoverZone(null)}
                onDrop={e => onDrop(zone, e)}
                style={{
                  position:'absolute',
                  top:cfg.top, left:0, right:0,
                  height:cfg.h,
                  border: isHov ? '1px solid rgba(200,255,0,0.5)' : '1px solid transparent',
                  background: isHov ? 'rgba(200,255,0,0.06)' : 'transparent',
                  boxShadow: isHov ? '0 0 24px rgba(200,255,0,0.1) inset' : 'none',
                  transition:'all 0.15s ease',
                  zIndex:3,
                }}
              >
                {/* Zone label */}
                {showLabel && (
                  <div style={{
                    position:'absolute',
                    right:-90,top:'50%',transform:'translateY(-50%)',
                    display:'flex',flexDirection:'column',gap:2,
                  }}>
                    <span style={{
                      fontSize:8,letterSpacing:2,
                      color: isHov ? 'var(--accent)' : '#2A2A2A',
                      whiteSpace:'nowrap',
                    }}>{zone}</span>
                    {isHov && (
                      <span style={{fontSize:7,color:'#333',whiteSpace:'nowrap'}}>{cfg.hint}</span>
                    )}
                  </div>
                )}

                {/* Placed item chips in zone */}
                <div style={{
                  position:'absolute',bottom:4,left:4,
                  display:'flex',flexWrap:'wrap',gap:4,
                  maxWidth:'calc(100% - 8px)',
                  zIndex:10,
                }}>
                  {items.map((p, idx) => (
                    <div key={p.id} style={{
                      background: p.item.bg,
                      border:`1px solid rgba(255,255,255,0.08)`,
                      width:46,height:32,
                      display:'flex',alignItems:'center',justifyContent:'center',
                      fontSize:18,
                      boxShadow:'0 2px 10px rgba(0,0,0,0.6)',
                      animation:'dropIn 0.2s cubic-bezier(.2,.8,.4,1)',
                      cursor:'default',
                      position:'relative',
                      flexShrink:0,
                    }} title={`${p.item.name} · ${p.zone}`}>
                      {p.item.icon}
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        {/* Empty hint */}
        {placed.length === 0 && !dragItem && (
          <div style={{
            position:'absolute',bottom:28,left:'50%',transform:'translateX(-50%)',
            textAlign:'center',pointerEvents:'none',
          }}>
            <p style={{fontSize:9,color:'#222',letterSpacing:3}}>← DRAG FROM WARDROBE TO DRESS</p>
          </div>
        )}

        {/* Drag hint glow on canvas during drag */}
        {dragItem && (
          <div style={{
            position:'absolute',inset:0,pointerEvents:'none',
            background:'radial-gradient(circle at 50% 50%, rgba(200,255,0,0.03) 0%, transparent 60%)',
            animation:'pulse 1.5s ease infinite',
          }}/>
        )}
      </div>

      {/* ── RIGHT PANEL ───────────────────────────────── */}
      <div style={{
        width:'var(--right)',flexShrink:0,
        background:'var(--surface)',
        borderLeft:'1px solid var(--border-subtle)',
        display:'flex',flexDirection:'column',
        overflow:'hidden',
      }}>
        {/* Header */}
        <div style={{padding:'16px 18px',borderBottom:'1px solid var(--border-subtle)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
            <p style={{fontSize:8,color:'#444',letterSpacing:3}}>LAYERS</p>
            <span style={{fontSize:8,color:'#333'}}>{placed.length} / 8</span>
          </div>
          {placed.length > 0 && (
            <div style={{
              marginTop:8,height:2,background:'#111',borderRadius:1,overflow:'hidden',
            }}>
              <div style={{
                height:'100%',width: (placed.length/8*100) + '%',
                background:'var(--accent)',
                transition:'width 0.3s ease',
                boxShadow:'0 0 4px var(--accent-glow)',
              }}/>
            </div>
          )}
        </div>

        {/* Layers */}
        <div style={{flex:1,overflowY:'auto',padding:'8px 0'}}>
          {placed.length === 0 ? (
            <div style={{
              margin:'16px',
              border:'1px dashed #161616',
              padding:'28px 16px',
              textAlign:'center',
            }}>
              <p style={{fontSize:9,color:'#2A2A2A',lineHeight:1.9}}>
                No items yet.<br/>Drag from wardrobe.
              </p>
            </div>
          ) : (
            placed.map((p, i) => (
              <div key={p.id} style={{
                display:'flex',alignItems:'center',gap:10,
                padding:'8px 16px',
                borderBottom:'1px solid #0E0E0E',
                transition:'background 0.1s ease',
                animation:'slideUp 0.18s ease',
              }}
                onMouseEnter={e => e.currentTarget.style.background='#0E0E0E'}
                onMouseLeave={e => e.currentTarget.style.background='transparent'}
              >
                <div style={{
                  width:28,height:22,background:p.item.bg,flexShrink:0,
                  display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,
                }}>{p.item.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{fontSize:9,color:'#CCC',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.item.name}</p>
                  <p style={{fontSize:7,color:'#444',marginTop:2,letterSpacing:1}}>{p.zone} · {p.item.cat}</p>
                </div>
                <button
                  onClick={() => doRemove(p.id)}
                  style={{
                    background:'none',border:'none',color:'#2A2A2A',
                    cursor:'pointer',fontSize:16,padding:0,lineHeight:1,
                    transition:'color 0.1s',flexShrink:0,
                  }}
                  onMouseEnter={e => e.currentTarget.style.color='var(--red)'}
                  onMouseLeave={e => e.currentTarget.style.color='#2A2A2A'}
                >×</button>
              </div>
            ))
          )}
        </div>

        {/* Generate section */}
        <div style={{padding:16,borderTop:'1px solid var(--border-subtle)',background:'#080808'}}>
          {/* Credits display */}
          <div style={{
            display:'flex',justifyContent:'space-between',alignItems:'center',
            marginBottom:14,padding:'8px 12px',
            background:'#0A0A0A',border:'1px solid #141414',
          }}>
            <div style={{display:'flex',gap:7,alignItems:'center'}}>
              <span style={{color:'var(--accent)',fontSize:12}}>⚡</span>
              <span style={{fontSize:9,color:'#555',letterSpacing:1}}>CREDITS</span>
            </div>
            <span style={{fontSize:16,fontWeight:600,color: credits > 4 ? '#DDD' : 'var(--warn)',fontFamily:'Syne'}}>{credits}</span>
          </div>

          {/* Generate CTA */}
          <button
            onClick={doGenerate}
            style={{
              width:'100%',
              background: doneState ? 'var(--ok)' : placed.length > 0 ? 'var(--accent)' : '#0E0E0E',
              color: doneState ? '#000' : placed.length > 0 ? '#000' : '#2A2A2A',
              border: placed.length > 0 ? 'none' : '1px solid #1A1A1A',
              padding:'13px 0',
              fontSize:10,fontFamily:'JetBrains Mono',fontWeight:700,
              cursor: placed.length > 0 ? 'pointer' : 'not-allowed',
              letterSpacing:2,
              transition:'all 0.2s ease',
              boxShadow: placed.length > 0 && !doneState ? '0 0 20px rgba(200,255,0,0.15)' : 'none',
            }}
          >
            {doneState ? '✓ SENT TO AI' : '⚡ GENERATE LOOK'}
          </button>

          {placed.length > 0 && !doneState && (
            <p style={{fontSize:7,color:'#333',textAlign:'center',marginTop:8,letterSpacing:1}}>
              2 CREDITS · RESULTS IN ~30 SECONDS
            </p>
          )}
        </div>
      </div>

      {/* ── OVERLAYS ──────────────────────────────────── */}
      {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)}/>}

      {replaceQ && (
        <ReplaceModal
          cur={replaceQ.conflict.item}
          next={replaceQ.next.item}
          onReplace={doReplace}
          onKeepBoth={doKeepBoth}
          onCancel={() => setReplaceQ(null)}
        />
      )}

      {showGen && (
        <GenerateModal
          placed={placed.map(p => ({ name: p.item.name, zone: p.zone, icon: p.item.icon }))}
          credits={credits}
          onConfirm={confirmGenerate}
          onCancel={() => setShowGen(false)}
        />
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
